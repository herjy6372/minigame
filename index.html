<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="30초 동안 움직이는 고양이를 클릭하는 미니게임">
  <title>미로 탈출 한 칸 모험</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-card" aria-labelledby="game-title">
    <header class="game-header">
      <p class="eyebrow">교실 고양이 미니게임</p>
      <h1 id="game-title">미로 탈출 한 칸 모험</h1>
      <p id="guide-text" class="guide">30초 동안 움직이는 고양이를 최대한 많이 클릭하세요!</p>
    </header>

    <section class="status-board" aria-label="게임 상태">
      <div class="status-item">
        <span class="status-label">점수</span>
        <strong id="score" class="status-value">0</strong>
      </div>
      <div class="status-item">
        <span class="status-label">남은 시간</span>
        <strong class="status-value"><span id="time-left">30</span><small>초</small></strong>
      </div>
    </section>

    <section id="game-area" class="game-area" aria-label="고양이 클릭 게임 영역">
      <div id="ready-panel" class="panel">
        <span class="panel-icon" aria-hidden="true">🐾</span>
        <p>준비되면 시작 버튼을 눌러주세요.</p>
      </div>

      <button id="cat-target" class="cat-target" type="button" aria-label="고양이 클릭"></button>

      <div id="result-panel" class="panel result-panel" aria-live="polite">
        <p class="result-label">게임 종료!</p>
        <p class="result-score">최종 점수 <strong id="final-score">0</strong>점</p>
        <button id="restart-button" class="primary-button" type="button">다시 하기</button>
      </div>
    </section>

    <div class="controls">
      <button id="start-button" class="primary-button" type="button">게임 시작</button>
    </div>

    <audio id="cat-sound" src="./sounds/cat-meow.wav" preload="auto"></audio>
  </main>

  <script src="./game.js"></script>
</body>
</html>
